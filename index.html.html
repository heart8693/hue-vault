<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamut — The Color Combination Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0D0F; --surface:#131316; --surface-2:#1A1A1E;
    --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.12);
    --ink:#EDEDEF; --ink-2:#8F8F98; --ink-3:#55555E;
    --accent:#2055E6; --accent-ink:#6E92F2;
    --shadow-card:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
    --shadow-pop:0 4px 12px rgba(0,0,0,.5);
  }
  [data-theme="light"]{
    --bg:#FAFAF9; --surface:#FFFFFF; --surface-2:#F2F2F0;
    --line:rgba(20,20,22,.08); --line-strong:rgba(20,20,22,.14);
    --ink:#1A1A1C; --ink-2:#6E6E76; --ink-3:#ACACB2;
    --accent:#2055E6; --accent-ink:#2055E6;
    --shadow-card:0 1px 2px rgba(20,20,30,.06), 0 8px 24px rgba(20,20,30,.07);
    --shadow-pop:0 4px 16px rgba(20,20,30,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:13px; background:var(--bg); color:var(--ink);
    font-feature-settings:"tnum","cv05","cv11";
    transition:background .25s,color .25s;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
  button{font-family:inherit;color:inherit}
  ::selection{background:rgba(32,85,230,.35)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .app{display:flex;height:100vh;height:100dvh;overflow:hidden}

  /* ═══ SIDEBAR ═══ */
  .side{
    width:236px;flex-shrink:0;display:flex;flex-direction:column;
    border-right:1px solid var(--line);background:var(--bg);padding:18px 12px 14px;
  }
  .ws{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
  .ws-mark{width:26px;height:26px;flex-shrink:0;display:grid;place-items:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
  .ws-mark svg{width:24px;height:24px;display:block}
  .ws-name{font-size:13px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
  .ws-sub{font-size:10.5px;color:var(--ink-3);font-weight:500;margin-top:1px}
  .nav-label{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:14px 10px 6px}
  .nav{display:flex;flex-direction:column;gap:1px}
  .nav button{
    display:flex;align-items:center;gap:9px;width:100%;
    padding:7px 10px;border:none;background:transparent;color:var(--ink-2);
    font-size:13px;font-weight:500;text-align:left;border-radius:7px;cursor:pointer;
    transition:background .12s,color .12s;
  }
  .nav button svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
  .nav button:hover{background:var(--surface-2);color:var(--ink)}
  .nav button.on{background:var(--surface-2);color:var(--ink);font-weight:600}
  .nav button.on svg{color:var(--accent-ink);opacity:1}
  .nav button .cnt{margin-left:auto;font-size:11px;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .side-foot{margin-top:auto;padding:10px 8px 0;display:flex;align-items:center;justify-content:space-between}
  .ver{font-size:10.5px;color:var(--ink-3);font-weight:500}

  /* ═══ MAIN ═══ */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
  .topbar{
    height:54px;flex-shrink:0;display:flex;align-items:center;gap:14px;
    padding:0 24px;border-bottom:1px solid var(--line);
  }
  .topbar h2{font-size:14px;font-weight:600;letter-spacing:-.01em}
  .topbar .cnt{font-size:12px;color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}
  .topbar .spacer{flex:1}

  /* filter zone */
  .filterbar{flex-shrink:0;display:flex;flex-direction:column;gap:10px;padding:16px 24px 2px}
  .fb-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{
    display:inline-flex;align-items:center;gap:7px;height:32px;
    padding:0 12px 0 14px;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
    font-size:12.5px;font-weight:500;white-space:nowrap;transition:all .12s;
  }
  .pill:hover{color:var(--ink);border-color:var(--line-strong)}
  .pill .b{
    font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;
    background:var(--surface-2);color:var(--ink-3);font-variant-numeric:tabular-nums;
  }
  .pill.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .pill.on .b{background:rgba(255,255,255,.22);color:#fff}
  .pill.no-b{padding:0 14px}

  .search{position:relative;flex-shrink:0}
  .search svg{
    position:absolute;left:10px;top:50%;transform:translateY(-50%);
    width:13px;height:13px;stroke:var(--ink-3);fill:none;stroke-width:1.7;stroke-linecap:round;pointer-events:none;
  }
  .search input{
    width:290px;height:32px;background:var(--surface);border:1px solid var(--line);
    color:var(--ink);font-family:inherit;font-size:12.5px;
    padding:0 28px 0 30px;border-radius:999px;outline:none;transition:border-color .12s;
  }
  .search input::placeholder{color:var(--ink-3)}
  .search input:focus{border-color:var(--accent)}
  .search .clear{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;border:none;background:transparent;color:var(--ink-3);
    cursor:pointer;font-size:13px;line-height:1;display:none;border-radius:4px;
  }
  .search .clear:hover{color:var(--ink)}
  .search.has-q .clear{display:block}

  .icon-btn{
    width:32px;height:32px;border:1px solid var(--line);border-radius:999px;background:var(--surface);
    display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:all .12s;flex-shrink:0;
  }
  .icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
  .icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  .btn{
    height:32px;padding:0 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;
    border:1px solid transparent;transition:all .12s;display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
  }
  .btn-primary{background:var(--accent);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
  .btn-primary:hover{background:#1A49CC}
  .btn-primary:disabled{opacity:.55;cursor:default}
  .btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
  .btn .spark{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .btn-secondary:hover{border-color:var(--line-strong)}

  /* AI popover */
  .pop-wrap{position:relative;flex-shrink:0}
  .pop{
    position:absolute;right:0;top:calc(100% + 8px);width:320px;z-index:50;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;
    box-shadow:var(--shadow-pop);padding:14px;display:none;
  }
  .pop.open{display:block}
  .pop label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
  .pop input{
    width:100%;height:34px;background:var(--bg);border:1px solid var(--line);color:var(--ink);
    font-family:inherit;font-size:12.5px;padding:0 12px;border-radius:8px;outline:none;transition:border-color .12s;
  }
  .pop input:focus{border-color:var(--accent)}
  .pop input::placeholder{color:var(--ink-3)}
  .pop .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px}
  .pop .chip{
    border:1px solid var(--line);background:transparent;color:var(--ink-2);
    font-size:11.5px;font-weight:500;padding:5px 11px;border-radius:999px;cursor:pointer;transition:all .12s;
  }
  .pop .chip:hover{color:var(--ink);border-color:var(--line-strong)}
  .pop .btn{width:100%;justify-content:center}

  /* ═══ ADD MODAL ═══ */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .overlay.open{display:flex}
  .modal{
    width:400px;max-width:100%;max-height:90vh;overflow-y:auto;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;
    box-shadow:var(--shadow-pop);padding:18px;
  }
  .modal h3{font-size:14px;font-weight:600;margin-bottom:14px}
  .m-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:14px 0 8px}
  .m-label:first-of-type{margin-top:0}
  .c-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .c-row input[type=color]{
    width:38px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);
    padding:3px;cursor:pointer;flex-shrink:0;
  }
  .c-row input[type=text]{
    height:34px;background:var(--bg);border:1px solid var(--line);color:var(--ink);
    font-family:inherit;font-size:12.5px;padding:0 10px;border-radius:8px;outline:none;
  }
  .c-row input[type=text]:focus{border-color:var(--accent)}
  .c-row .hexin{width:88px;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
  .c-row .namein{flex:1;min-width:0}
  .c-row .x{
    width:26px;height:26px;border:none;background:transparent;color:var(--ink-3);cursor:pointer;
    font-size:14px;border-radius:6px;flex-shrink:0;
  }
  .c-row .x:hover{color:var(--ink)}
  .c-row .drop{
    width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);
    display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex-shrink:0;
  }
  .c-row .drop:hover{color:var(--ink);border-color:var(--line-strong)}
  .c-row .drop svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .m-add{
    width:100%;height:32px;border:1px dashed var(--line-strong);border-radius:8px;background:transparent;
    color:var(--ink-2);font-size:12px;font-weight:500;cursor:pointer;margin-bottom:4px;
  }
  .m-add:hover{color:var(--ink)}
  .m-foot{display:flex;gap:8px;margin-top:16px}
  .m-foot .btn{flex:1;justify-content:center;border-radius:8px}
  .m-preview{display:flex;height:44px;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin-top:14px}
  .m-preview div{flex:1}

  /* ═══ GRID ═══ */
  .scroll{flex:1;overflow-y:auto;padding:14px 24px 64px}
  .grid{columns:3;column-gap:16px}
  @media(min-width:1560px){.grid{columns:4}}
  @media(max-width:1020px){.grid{columns:2}}
  @media(max-width:580px){
    .grid{columns:2;column-gap:10px}
    .card{margin-bottom:10px;border-radius:9px}
    .band .nm{font-size:13px}
    .card.n3 .band .nm,.card.n4 .band .nm{font-size:12px}
    .band .hx{font-size:9px;letter-spacing:.09em}
    .card.n2 .band{min-height:96px;padding:16px 10px}
    .card.n3 .band{min-height:72px;padding:12px 10px}
    .card.n4 .band{min-height:60px;padding:10px 10px}
    .card.grad{min-height:260px;gap:20px;padding:26px 12px}
    .card.grad .g-item .nm{font-size:13px}
    .card.grad .g-item .hx{font-size:9px}
    .card-act{opacity:1;transform:none}
  }
  .card{
    break-inside:avoid;margin-bottom:16px;border-radius:10px;overflow:hidden;
    display:flex;flex-direction:column;position:relative;
    border:1px solid var(--line);box-shadow:var(--shadow-card);transition:box-shadow .18s;
  }
  .card:hover{box-shadow:var(--shadow-pop)}
  .band{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 14px;cursor:pointer;text-align:center;transition:filter .12s;
  }
  .band:active{filter:brightness(.94)}
  .band .nm{
    font-family:'Poppins',sans-serif;font-weight:800;text-transform:uppercase;
    font-size:clamp(15px,1.4vw,19px);letter-spacing:.01em;line-height:1.15;
  }
  .band .hx{font-size:10.5px;margin-top:6px;letter-spacing:.12em;font-weight:500;opacity:.92}
  .card.n2 .band{min-height:140px}
  .card.n3 .band{min-height:92px;padding:18px 14px}
  .card.n4 .band{min-height:76px;padding:14px 14px}
  .card.n3 .band .nm,.card.n4 .band .nm{font-size:clamp(13px,1.2vw,16px)}

  .card.grad{min-height:380px;justify-content:center;gap:30px;padding:42px 18px}
  .card.grad .g-item{cursor:pointer;text-align:center}
  .card.grad .g-item .nm{font-family:'Poppins',sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(15px,1.4vw,19px);letter-spacing:.01em;line-height:1.15}
  .card.grad .g-item .hx{font-size:10.5px;margin-top:6px;letter-spacing:.12em;font-weight:500;opacity:.92}

  .badge{
    position:absolute;top:8px;left:8px;font-size:8px;font-weight:600;letter-spacing:.08em;
    padding:2px 6px;border-radius:4px;background:rgba(10,10,12,.3);color:rgba(255,255,255,.72);
    backdrop-filter:blur(6px);text-transform:uppercase;pointer-events:none;z-index:1;
  }
  .card-act{
    position:absolute;top:10px;right:10px;z-index:2;display:flex;gap:6px;
    opacity:0;transform:translateY(-2px);transition:all .15s;
  }
  .card:hover .card-act,.card:focus-within .card-act{opacity:1;transform:none}
  .card-act button{
    height:24px;padding:0 10px;border:none;border-radius:6px;cursor:pointer;
    background:rgba(10,10,12,.55);color:#fff;font-size:10px;font-weight:600;letter-spacing:.07em;
    text-transform:uppercase;backdrop-filter:blur(8px);
  }
  .card-act button:hover{background:rgba(10,10,12,.78)}
  .hx{position:relative}
  .hx .cp{position:absolute;right:-17px;top:50%;transform:translateY(-50%);opacity:0;transition:opacity .12s}
  .band:hover .hx .cp,.g-item:hover .hx .cp{opacity:.9}
  .copied{box-shadow:inset 0 0 0 2px var(--accent)}

  .empty{padding:72px 20px;text-align:center;color:var(--ink-3);font-size:13px}
  .feed-hint{padding:22px 0 6px;text-align:center;color:var(--ink-3);font-size:11.5px;font-weight:500;letter-spacing:.04em}

  /* ═══ SPECS ═══ */
  .specs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;max-width:1200px}
  .spec-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow-card)}
  .spec-head{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
  .spec-head h3{font-size:13px;font-weight:600;letter-spacing:-.01em}
  .spec-head p{font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.45}
  .spec-rows{padding:6px 6px 8px}
  .spec-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 10px;border-radius:6px;cursor:pointer;transition:background .1s}
  .spec-row:hover{background:var(--surface-2)}
  .spec-row .k{font-size:12.5px;color:var(--ink-2);font-weight:500}
  .spec-row .v{font-size:12px;font-weight:500;color:var(--ink);text-align:right;white-space:nowrap}
  .spec-row:hover .v{color:var(--accent-ink)}
  .spec-note{grid-column:1/-1;font-size:12px;color:var(--ink-2);line-height:1.55;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
  .spec-note b{color:var(--ink);font-weight:600}

  .toast{
    position:fixed;bottom:20px;right:20px;transform:translateY(8px);
    background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);
    font-size:12px;font-weight:500;padding:9px 14px;border-radius:8px;
    opacity:0;pointer-events:none;transition:all .2s;z-index:99;box-shadow:var(--shadow-pop);
    display:flex;align-items:center;gap:8px;max-width:340px;
  }
  .toast .dot{width:8px;height:8px;border-radius:3px;background:var(--accent);flex-shrink:0}
  .toast.show{opacity:1;transform:translateY(0)}

  .m-only{display:none}
  .tabbar{
    display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:var(--bg);border-top:1px solid var(--line);
    padding:4px 6px calc(6px + env(safe-area-inset-bottom));
  }
  .tabbar button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:7px 0 4px;border:none;background:transparent;color:var(--ink-3);
    font-size:9.5px;font-weight:600;letter-spacing:.02em;border-radius:10px;cursor:pointer;
  }
  .tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button.on{color:var(--accent-ink)}

  @media(pointer:coarse){
    .btn,.pill,.icon-btn,.search input{height:40px}
    .icon-btn{width:40px}
    .btn{padding:0 16px;font-size:13px}
    .pill{font-size:13px}
    .nav button{padding:10px 12px}
    .card-act button{height:30px;padding:0 12px;font-size:11px}
    .spec-row{padding:11px 12px}
    .pop input,.c-row input[type=text],.c-row input[type=color],.c-row .drop{height:40px}
    .c-row input[type=color]{width:42px}
    .c-row .drop{width:40px}
    .m-add{height:38px}
  }

  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  @media(max-width:780px){
    .side{display:none}
    .tabbar{display:flex}
    .m-only{display:grid}
    .topbar{padding:0 14px;gap:10px}
    .filterbar{padding:12px 14px 2px}
    .search input{width:170px}
    .scroll{padding:14px 14px 110px}
    .pills{flex-wrap:nowrap;overflow-x:auto;max-width:100%;gap:16px;padding-bottom:2px;scrollbar-width:none}
    .pills::-webkit-scrollbar{display:none}
    .pill{border:none;background:transparent;padding:0 1px;height:32px;border-radius:0;font-size:13px}
    .pill:hover{border:none}
    .pill .b{display:none}
    .pill.on{background:transparent;color:var(--ink);font-weight:700;border-bottom:2px solid var(--ink);border-radius:0}
    .pop{right:auto;left:0}
  }
</style>
</head>
<body data-theme="dark">
<div class="app">
  <aside class="side">
    <div class="ws">
      <div class="ws-mark"><svg viewBox="0 0 26 26"><g><rect x="10.7" y="3.8" width="4.6" height="16.4" rx="2.3" fill="#2055E6" transform="rotate(-30 13 19.5)"/><rect x="10.7" y="3.8" width="4.6" height="16.4" rx="2.3" fill="#FF8A4C" transform="rotate(30 13 19.5)"/><rect x="10.7" y="3.8" width="4.6" height="16.4" rx="2.3" fill="#A855F7"/></g></svg></div>
      <div>
        <div class="ws-name">Gamut</div>
        <div class="ws-sub">The Combination Archive</div>
      </div>
    </div>
    <div id="navWrap" style="display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto"></div>
    <div class="side-foot"><span class="ver">for Dean</span><span class="ver">v1.8</span></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="ws-mark m-only"><svg viewBox="0 0 26 26"><g><rect x="10.7" y="3.8" width="4.6" height="16.4" rx="2.3" fill="#2055E6" transform="rotate(-30 13 19.5)"/><rect x="10.7" y="3.8" width="4.6" height="16.4" rx="2.3" fill="#FF8A4C" transform="rotate(30 13 19.5)"/><rect x="10.7" y="3.8" width="4.6" height="16.4" rx="2.3" fill="#A855F7"/></g></svg></div><h2 id="tabTitle"></h2><span class="cnt" id="countLbl"></span>
      <div class="spacer"></div>
      <button class="icon-btn" id="shuffleBtn" title="Shuffle order (S)">
        <svg viewBox="0 0 16 16"><path d="M1.5 4.5h3l6 7h4M14.5 11.5l-2-2m2 2l-2 2M1.5 11.5h3l1.8-2.1M8.7 6.6l1.8-2.1h4M14.5 4.5l-2-2m2 2l-2 2"/></svg>

const hex2rgb=h=>{h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const lum=h=>{const[r,g,b]=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b};
const contrast=(a,b)=>{const[l1,l2]=[lum(a),lum(b)].sort((x,y)=>y-x);return(l1+.05)/(l2+.05)};
const hsl2hex=(h,s,l)=>{h=((h%360)+360)%360;s=Math.max(0,Math.min(100,s))/100;l=Math.max(0,Math.min(100,l))/100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return'#'+[f(0),f(8),f(4)].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('').toUpperCase()};
const rgb2hsl=(r,g,b)=>{r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);switch(mx){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4}h*=60}return[h,s*100,l*100]};
const hexHSL=h=>rgb2hsl(...hex2rgb(h));
const avgHex=arr=>{let r=0,g=0,b=0;arr.forEach(h=>{const[x,y,z]=hex2rgb(h);r+=x;g+=y;b+=z});const n=arr.length;return'#'+[r/n,g/n,b/n].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('')};

function bandText(c,arr){
  const cand=arr.filter(x=>x!==c).sort((a,b)=>contrast(c,b)-contrast(c,a))[0];
  if(cand&&contrast(c,cand)>=1.35)return cand;
  return lum(c)>.45?'#141414':'#FCFCFC';
}
function gradItemText(c,arr){
  const others=arr.filter(x=>x!==c);
  const back=avgHex(others.length?others:arr);
  if(contrast(back,c)>=2.0)return c;
  const cand=[...arr].sort((a,b)=>contrast(back,b)-contrast(back,a))[0];
  if(cand&&contrast(back,cand)>=2.0)return cand;
  return lum(back)>.45?'#141414':'#FCFCFC';
}

function matchesQuery(x,q){
  const tokens=q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!tokens.length)return true;
  const hsls=x.c.map(hexHSL);
  return tokens.every(tk=>{
    const fam=FAMILY[ALIAS[tk]||tk];
    if(fam&&hsls.some(fam))return true;
    if(x.n.some(n=>n.toLowerCase().includes(tk)))return true;
    if(x.c.some(c=>c.toLowerCase().includes(tk.replace('#',''))&&tk.length>=3))return true;
    return false;
  });
}

function genFor(cat,type){
  const pool=type?POOLS[cat].filter(r=>String(r.t)===String(type)):POOLS[cat];
  for(let tries=0;tries<10;tries++){
    const r=pool[Math.floor(Math.random()*pool.length)];
    const cols=r.f(Math.random()*360).map(([H,S,L])=>hsl2hex(H,S,L));
    if(new Set(cols).size!==cols.length)continue;
    if(r.t!=='g'&&!okAdjacent(cols))continue;
    return {cat,t:r.t==='g'?'g':cols.length,c:cols,n:dedupeNames(cols.map(nearestName),cols),gen:'Gen'};
  }
  const cols=[hsl2hex(Math.random()*360,70,55),hsl2hex(Math.random()*360,20,92)];
  return {cat,t:2,c:cols,n:dedupeNames(cols.map(nearestName),cols),gen:'Gen'};
}

  const aiTools=tab==='ai'?`
    <button class="btn btn-secondary" id="rndGen">
      <svg width="14" height="14" viewBox="0 0 16 16" style="stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><rect x="2" y="2" width="12" height="12" rx="2.5"/><circle cx="5.5" cy="5.5" r=".9" fill="currentColor" stroke="none"/><circle cx="10.5" cy="5.5" r=".9" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r=".9" fill="currentColor" stroke="none"/><circle cx="5.5" cy="10.5" r=".9" fill="currentColor" stroke="none"/><circle cx="10.5" cy="10.5" r=".9" fill="currentColor" stroke="none"/></svg>
      Random
    </button>
    <div class="pop-wrap">
      <button class="btn btn-primary" id="aiGenBtn"><svg class="spark" viewBox="0 0 16 16"><path d="M8 1.5l1.4 4.1L14 7l-4.6 1.4L8 12.5 6.6 8.4 2 7l4.6-1.4z"/><path d="M12.8 11.4l.5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5z"/></svg>Generate</button>
      <div class="pop ${popOpen?'open':''}" id="aiPop">
        <label>Mood</label>
        <input id="aiInput" placeholder="e.g. dawn fog over Seoul, Y2K editorial…">
        <div class="chips">
          <button class="chip">gorpcore</button><button class="chip">hanok dessert</button>
          <button class="chip">Y2K editorial</button><button class="chip">michelin plating</button>
          <button class="chip">seoul at dawn</button>
        </div>
        <button class="btn btn-primary" id="aiRun"><svg class="spark" viewBox="0 0 16 16"><path d="M8 1.5l1.4 4.1L14 7l-4.6 1.4L8 12.5 6.6 8.4 2 7l4.6-1.4z"/><path d="M12.8 11.4l.5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5z"/></svg>Generate 6 palettes</button>
      </div>
    </div>`:'';
  fb.innerHTML=`
    <div class="fb-row">
      <div class="search ${searchQ?'has-q':''}">
        <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6L14 14"/></svg>
        <input id="searchInput" placeholder="Search — blue, pastel, neon, warm, #2055…" value="${searchQ.replace(/"/g,'&quot;')}">
        <button class="clear" id="searchClear">✕</button>
      </div>
      <div style="flex:1"></div>
      ${addBtn}
      ${aiTools}
    </div>
    <div class="fb-row">
      <div class="pills" id="filterPills">
        ${FILTERS.map(([v,l])=>`
          <button class="pill ${String(filter)===String(v)?'on':''}" data-f="${v}">
            ${l}<span class="b">${cnts[v==='all'?'all':v]||0}</span>
          </button>`).join('')}
      </div>
    </div>`;
  const inp=fb.querySelector('#searchInput');
  inp.oninput=()=>{searchQ=inp.value;renderResultsOnly();refreshPillCounts()};
  fb.querySelector('#searchClear').onclick=()=>{searchQ='';renderFilterbar();renderResultsOnly()};
  fb.querySelectorAll('#filterPills .pill').forEach(b=>b.onclick=()=>{filter=b.dataset.f==='all'?'all':(b.dataset.f==='g'?'g':+b.dataset.f);render()});
  fb.querySelector('#addBtn').onclick=openAdd;
  if(tab==='ai'){
    const pop=fb.querySelector('#aiPop');
    fb.querySelector('#rndGen').onclick=()=>{aiPals=[...Array.from({length:8},randomPalette),...aiPals];persist();render()};
    fb.querySelector('#aiGenBtn').onclick=e=>{e.stopPropagation();popOpen=!popOpen;pop.classList.toggle('open',popOpen);if(popOpen)pop.querySelector('#aiInput').focus()};
    pop.onclick=e=>e.stopPropagation();
    pop.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{pop.querySelector('#aiInput').value=ch.textContent});
    pop.querySelector('#aiRun').onclick=()=>runAI(pop);
    pop.querySelector('#aiInput').addEventListener('keydown',e=>{if(e.key==='Enter')runAI(pop)});
  }
}
function refreshPillCounts(){
  const cnts=typeCounts();
  document.querySelectorAll('#filterPills .pill').forEach(b=>{
    const v=b.dataset.f;b.querySelector('.b').textContent=cnts[v==='all'?'all':v]||0;
  });
}
document.addEventListener('click',()=>{
  if(popOpen){popOpen=false;const pop=$('aiPop');if(pop)pop.classList.remove('open')}
});

function currentItems(){
  let items=tab==='ai'?aiPals:libBase(tab);
  if(filter!=='all')items=items.filter(x=>String(x.t)===String(filter));
  if(searchQ.trim())items=items.filter(x=>matchesQuery(x,searchQ));
  return items;
}
function shuffled(arr){
  const a=[...arr];let s=(seed+1)*9301+49297;
  for(let i=a.length-1;i>0;i--){s=(s*9301+49297)%233280;const j=Math.floor(s/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

function cardHTML(x){
  const badge=x.mine?`<div class="badge">Mine</div>`:x.ref?`<div class="badge">Ref</div>`:x.gen?`<div class="badge">${x.gen}</div>`:'';
  const acts=`<div class="card-act">
    ${x.mine?`<button data-remove="${x.id}">Remove</button>`:''}
    <button data-copyall="${x.c.join(', ')}">Copy all</button>
  </div>`;
  if(x.t==='g'){
    const base=`linear-gradient(165deg, ${x.c.map((c,i)=>`${c} ${Math.round(i/(x.c.length-1)*100)}%`).join(', ')})`;
    const mesh=x.c.map((c,i)=>`radial-gradient(ellipse at ${['18% 12%','85% 40%','25% 88%','78% 92%'][i%4]}, ${c} 0%, transparent 60%)`).join(',');
    return `<div class="card grad" style="background-image:${mesh}, ${base}">${badge}${acts}
      ${x.c.map((c,i)=>{const tc=gradItemText(c,x.c);return`
        <div class="g-item" data-hex="${c}">
          <div class="nm" style="color:${tc}">${x.n[i]}</div>
          <div class="hx mono" style="color:${tc}">HEX&nbsp;&nbsp;${c}<span class="cp">⧉</span></div>
        </div>`}).join('')}
    </div>`;
  }
  return `<div class="card n${x.t}">${badge}${acts}
    ${x.c.map((c,i)=>{const tc=bandText(c,x.c);return`
      <div class="band" style="background:${c}" data-hex="${c}">
        <div class="nm" style="color:${tc}">${x.n[i]}</div>
        <div class="hx mono" style="color:${tc}">HEX&nbsp;&nbsp;${c}<span class="cp">⧉</span></div>
      </div>`}).join('')}
  </div>`;
}

function specsHTML(){
  const s=SPECS[specSeg];
  return `<div class="specs-grid">
    <div class="spec-note">${s.note} &nbsp;·&nbsp; Tap any value to copy.</div>
    ${s.groups.map(g=>`
      <div class="spec-card">
        <div class="spec-head"><h3>${g.h}</h3>${g.s?`<p>${g.s}</p>`:''}</div>
        <div class="spec-rows">
          ${g.rows.map(([k,v])=>`
            <div class="spec-row" data-copy="${v.replace(/<[^>]+>/g,'')}">
              <span class="k">${k}</span><span class="v mono">${v}</span>
            </div>`).join('')}
        </div>
      </div>`).join('')}
  </div>`;
}

function renderResultsOnly(){
  const sc=$('scroll');
  if(tab==='specs'){
    sc.innerHTML=specsHTML();
    sc.querySelectorAll('[data-copy]').forEach(el=>el.onclick=()=>copy(el.dataset.copy));
    $('countLbl').textContent=`${SPECS[specSeg].groups.length} groups`;
    return;
  }
  let items=currentItems();
  if(tab==='ai'){
    if(seed>0)items=shuffled(items);
  }else{
    const mine=items.filter(x=>x.mine);
    items=[...mine,...shuffled(items.filter(x=>!x.mine))];
  }
  $('countLbl').textContent=`${items.length} combinations`;
  const feedHint=!searchQ.trim()?`<div class="feed-hint">Scroll for more — the archive is endless ∞</div>`:'';
  sc.innerHTML=items.length
    ? `<div class="grid">${items.map(cardHTML).join('')}</div>${feedHint}`
    : `<div class="empty">${tab==='ai'?'Hit Generate or Random above.':'No combinations match.'}</div>`;
  sc.querySelectorAll('[data-hex]').forEach(el=>el.onclick=()=>{
    copy(el.dataset.hex);
    el.classList.add('copied');setTimeout(()=>el.classList.remove('copied'),480);
  });
  sc.querySelectorAll('[data-copyall]').forEach(el=>el.onclick=e=>{e.stopPropagation();copy(el.dataset.copyall)});
  sc.querySelectorAll('[data-remove]').forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const id=el.dataset.remove;
    for(const c of LIB)USER[c]=USER[c].filter(x=>String(x.id)!==String(id));
    persist();render();toast('Removed from archive');
  });
}

function render(){
  renderNav();
  $('tabTitle').textContent=TABS.find(x=>x.id===tab).label;
  $('shuffleBtn').style.display=tab==='specs'?'none':'';
  renderFilterbar();
  if(tab==='ai'&&aiPals.length===0){
    aiPals=Array.from({length:12},randomPalette);persist();renderNav();renderFilterbar();
  }
  renderResultsOnly();
}

/* infinite feed — every content tab */
$('scroll').addEventListener('scroll',()=>{
  if(tab==='specs'||feeding||searchQ.trim())return;
  const el=$('scroll');
  if(el.scrollTop+el.clientHeight>=el.scrollHeight-480){
    feeding=true;
    if(tab==='ai'){
      aiPals=[...aiPals,...Array.from({length:8},randomPalette)];
    }else{
      const ty=filter==='all'?undefined:filter;
      for(let i=0;i<12;i++)GEN[tab].push(genFor(tab,ty));
    }
    persist();
    const keep=el.scrollTop;
    renderResultsOnly();renderNav();refreshPillCounts();
    el.scrollTop=keep;
    setTimeout(()=>feeding=false,250);
  }
});

/* ═════════════ ADD COMBINATION ═════════════ */
let addState={cat:'poster',style:'solid',colors:[]};
const CATLBL={uiux:'UI / UX',poster:'Poster',pub:'Publication · Motion'};
function openAdd(){
  addState={cat:LIB.includes(tab)?tab:'poster',style:'solid',
    colors:[{hex:'#2055E6'},{hex:'#F4F1EA'}]};
  addState.colors.forEach(c=>c.name=nearestName(c.hex));
  buildAddUI();
  $('addOverlay').classList.add('open');
}
function buildAddUI(){
  $('mCat').innerHTML=LIB.map(c=>`<button class="pill no-b ${addState.cat===c?'on':''}" data-c="${c}">${CATLBL[c]}</button>`).join('');
  $('mCat').querySelectorAll('button').forEach(b=>b.onclick=()=>{addState.cat=b.dataset.c;buildAddUI()});
  $('mStyle').querySelectorAll('button').forEach(b=>{
    b.classList.toggle('on',b.dataset.st===addState.style);
    b.onclick=()=>{addState.style=b.dataset.st;buildAddUI()};
  });
  const hasDropper=!!window.EyeDropper;
  $('mRows').innerHTML=addState.colors.map((c,i)=>`
    <div class="c-row" data-i="${i}">
      <input type="color" value="${c.hex}">
      ${hasDropper?`<button class="drop" title="Pick from screen">
        <svg viewBox="0 0 16 16"><path d="M9.5 2.5l4 4M11 1l4 4-2 2-4-4zM10.5 5.5L3 13l-1.5.5L2 12l7.5-7.5"/></svg>
      </button>`:''}
      <input type="text" class="hexin mono" value="${c.hex}" maxlength="7">
      <input type="text" class="namein" value="${c.name}" placeholder="Name">
      ${addState.colors.length>2?`<button class="x" title="Remove color">✕</button>`:''}
    </div>`).join('');
  $('mRows').querySelectorAll('.c-row').forEach(row=>{
    const i=+row.dataset.i;
    const pick=row.querySelector('input[type=color]');
    const hexin=row.querySelector('.hexin');
    const namein=row.querySelector('.namein');
    const setHex=h=>{
      h=h.toUpperCase();if(!h.startsWith('#'))h='#'+h;
      if(!/^#[0-9A-F]{6}$/.test(h))return;
      addState.colors[i].hex=h;
      addState.colors[i].name=nearestName(h);
      buildAddUI();
    };
    pick.oninput=()=>setHex(pick.value);
    hexin.onchange=()=>setHex(hexin.value);
    namein.oninput=()=>{addState.colors[i].name=namein.value};
    const drop=row.querySelector('.drop');
    if(drop)drop.onclick=async()=>{
      try{const r=await new EyeDropper().open();setHex(r.sRGBHex)}catch(e){}
    };
    const x=row.querySelector('.x');
    if(x)x.onclick=()=>{addState.colors.splice(i,1);buildAddUI()};
  });
  $('mAddColor').style.display=addState.colors.length>=4?'none':'';
  $('mPreview').innerHTML=addState.style==='g'
    ?`<div style="flex:1;background:linear-gradient(90deg,${addState.colors.map(c=>c.hex).join(',')})"></div>`
    :addState.colors.map(c=>`<div style="background:${c.hex}"></div>`).join('');
}
$('mAddColor').onclick=()=>{
  if(addState.colors.length>=4)return;
  const h=hsl2hex(Math.random()*360,60,55);
  addState.colors.push({hex:h,name:nearestName(h)});
  buildAddUI();
};
$('mCancel').onclick=()=>$('addOverlay').classList.remove('open');
$('addOverlay').onclick=e=>{if(e.target.id==='addOverlay')$('addOverlay').classList.remove('open')};
$('mSave').onclick=()=>{
  const cols=addState.colors.map(c=>c.hex.toUpperCase());
  const names=addState.colors.map(c=>c.name.trim()||nearestName(c.hex));
  const dup=findDuplicate(cols);
  if(dup){
    toast(`Already exists — "${dup.n.join(' · ')}"${dup.cat&&CATLBL[dup.cat]?' in '+CATLBL[dup.cat]:''}`);
    return;
  }
  const item={cat:addState.cat,t:addState.style==='g'?'g':cols.length,c:cols,
    n:dedupeNames(names,cols),mine:1,id:Date.now()+''+Math.floor(Math.random()*999)};
  USER[addState.cat].unshift(item);
  persist();
  $('addOverlay').classList.remove('open');
  tab=addState.cat;filter='all';render();$('scroll').scrollTop=0;
  toast(`Added to ${CATLBL[addState.cat]}`);
};

/* ═════════════ MISC ═════════════ */
function toast(msg){const t=$('toast');$('toastMsg').textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}
function copy(v){
  const done=()=>toast(`Copied ${v}`);
  if(navigator.clipboard?.writeText){navigator.clipboard.writeText(v).then(done).catch(()=>fallback(v,done))}
  else fallback(v,done);
}
function fallback(v,done){const ta=document.createElement('textarea');ta.value=v;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast(v)}ta.remove()}

const themeBtn=$('themeBtn');
function setThemeIcon(){themeBtn.innerHTML=document.body.dataset.theme==='dark'?SUN:MOON}
themeBtn.onclick=()=>{
  document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark';
  setThemeIcon();
};
setThemeIcon();

$('shuffleBtn').onclick=()=>{seed++;renderResultsOnly();$('scroll').scrollTop=0};

async function runAI(pop){
  const btn=pop.querySelector('#aiRun'),mood=pop.querySelector('#aiInput').value.trim()||'sophisticated designer palettes';
  btn.disabled=true;btn.textContent='Generating…';
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:
        `You are a world-class color specialist. Create 6 color palettes for the mood: "${mood}". Mix of types: some 2-color, some 3-color, one 4-color, one gradient. Respond ONLY with a JSON array, no markdown, no prose. Each item: {"type":"2"|"3"|"4"|"g","colors":["#HEX",...],"names":["Evocative Name",...]} — names must be short, poetic, capitalized English color names matching each hex. Adjacent colors in each palette must differ clearly in lightness so bands read as separate.`}]})
    });
    const data=await res.json();
    const txt=(data.content||[]).filter(i=>i.type==='text').map(i=>i.text).join('').replace(/```json|```/g,'').trim();
    const arr=JSON.parse(txt);
    aiPals=[...arr.map(x=>({cat:'ai',t:x.type==='g'?'g':+x.type,c:x.colors.map(c=>c.toUpperCase()),n:x.names,gen:'AI'})),...aiPals];
    persist();popOpen=false;render();toast('6 AI palettes added');
  }catch(e){
    toast('AI unavailable — used the recipe engine instead');
    aiPals=[...Array.from({length:6},randomPalette),...aiPals];
    persist();popOpen=false;render();
  }
}

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if((e.key==='s'||e.key==='S')&&tab!=='specs'){seed++;renderResultsOnly();$('scroll').scrollTop=0;return}
  const i=+e.key-1;
  if(i>=0&&i<TABS.length){tab=TABS[i].id;filter='all';popOpen=false;render()}
});

topUp();
render();
loadSaved();
</script>
